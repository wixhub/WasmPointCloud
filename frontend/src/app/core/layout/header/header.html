<header class="control-panel">
  <div class="brand">
    <h1>Wasm Point Cloud Engine</h1>
  </div>

  <div class="metrics">
    <!-- Voxel Resolution Slider Control -->
    <div class="voxel-control">
      <label for="voxelSizeRange"
        >Voxel Resolution (Size): <strong>{{ pcService.voxelSize() }}</strong></label
      >
      <input
        id="voxelSizeRange"
        type="range"
        min="0.0"
        max="2.0"
        step="0.1"
        [value]="pcService.voxelSize()"
        (input)="onVoxelSizeChange($event)"
      />
    </div>

    <p class="status">{{ pcService.statusSummary() }}</p>

    <div class="status-indicator">
      @if (pcService.isLoading()) {
        <div class="badge info">Engine: Loading...</div>
      } @else if (pcService.isEngineReady()) {
        <div class="badge ready">Engine: Active</div>
      } @else {
        <div class="badge info">Engine: Standby</div>
      }
    </div>
  </div>
</header>
